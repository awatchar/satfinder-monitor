name: Refresh TinyGS stations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
      timezone: 'Asia/Bangkok'

permissions:
  contents: read

concurrency:
  group: tinygs-google-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.TINYGS_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Download TinyGS data and update Google Sheet
        run: npm run tinygs:sync -- --yes
        env:
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON }}
          TINYGS_BEARER_TOKEN: ${{ secrets.TINYGS_BEARER_TOKEN }}
